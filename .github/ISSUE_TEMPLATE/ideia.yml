name: 💡 Ideia / Feature request
description: Sugere uma funcionalidade nova / Suggest a new feature
labels: ["ideia"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: A ideia / The idea
      description: O que gostavas que o NEXUS fizesse e para quê / What should NEXUS do and why
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Mais detalhes (opcional) / More details (optional)
